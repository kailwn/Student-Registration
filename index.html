<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Event Pass</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --surface: #ffffff;
      --background: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Header Banner */
    .brand-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      padding: 2rem 2rem 1.5rem 2rem;
      position: relative;
    }

    .brand-header .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
      color: #93c5fd;
    }

    .brand-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .content-area {
      padding: 2rem;
    }

    /* Form Design */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #ffffff;
      color: var(--text-main);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 0.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 1rem;
    }

    .btn-secondary:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    /* Pass/Badge View */
    .hidden {
      display: none;
    }

    .badge-card {
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #166534;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }

    .status-badge::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .details-grid {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .detail-item {
      margin-bottom: 0.85rem;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .detail-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-word;
    }

    .qr-frame {
      display: inline-block;
      background: #ffffff;
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 1rem;
    }

    .helper-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="container">
    
    <!-- Header -->
    <header class="brand-header">
      <span class="tag">Event Portal</span>
      <h1 id="headerTitle">Student Registration</h1>
    </header>

    <div class="content-area">
      
      <!-- Form Screen -->
      <section id="signupSection">
        <form id="registrationForm">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter Full Name" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="school">School / Organization</label>
            <input type="text" id="school" placeholder="Enter School/Organization" required>
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter Address" required autocomplete="street-address">
          </div>

          <button type="submit" class="btn">Submit</button>
        </form>
      </section>

      <!-- QR CODE -->
      <section id="passSection" class="hidden badge-card">
        <div class="status-badge">Registration Confirmed</div>

        <div class="details-grid">
          <div class="detail-item">
            <div class="detail-label">Full Name</div>
            <div class="detail-value" id="valName">-</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Institution</div>
            <div class="detail-value" id="valSchool">-</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Location</div>
            <div class="detail-value" id="valAddress">-</div>
          </div>
        </div>

        <div class="qr-frame">
          <div id="qrcode"></div>
        </div>

        <p class="helper-text">SCAN THIS BARCODE.</p>

        <button id="resetBtn" class="btn btn-secondary">Register Another</button>
      </section>

    </div>
  </main>

  <script>
    const form = document.getElementById('registrationForm');
    const signupSection = document.getElementById('signupSection');
    const passSection = document.getElementById('passSection');
    const headerTitle = document.getElementById('headerTitle');
    const qrContainer = document.getElementById('qrcode');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('fullName').value.trim();
      const school = document.getElementById('school').value.trim();
      const address = document.getElementById('address').value.trim();

      // Update text values
      document.getElementById('valName').textContent = name;
      document.getElementById('valSchool').textContent = school;
      document.getElementById('valAddress').textContent = address;

      // Clear previous QR instance
      qrContainer.innerHTML = '';

      // Create payload format for scanner readers
      const payload = JSON.stringify({
        name: name,
        school: school,
        timestamp: new Date().toISOString()
      });

      // Generate high-resolution QR
      new QRCode(qrContainer, {
        text: payload,
        width: 180,
        height: 180,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // Transition interface
      headerTitle.textContent = "Digital Entry Pass";
      signupSection.classList.add('hidden');
      passSection.classList.remove('hidden');
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      form.reset();
      headerTitle.textContent = "Student Registration";
      passSection.classList.add('hidden');
      signupSection.classList.remove('hidden');
    });
  </script>

</body>
</html>
